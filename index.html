<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Halaman Login</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <section>
         <h1>Login ke Akun Anda</h1>
         <div class="email-password">
            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="agustianjaya@gmail.com" required></input>
            <label for="sandi">Kata Sandi :</label>
            <input type="password" id="sandi" name="sandi" placeholder="123xyz" required></input>
         </div>
         <label class="checkbox">
            <input type="checkbox" name="ingat" value="Ingat Saya" />
            Ingat Saya
         </label>
         <br />
         <input class="tombol" type="submit" value="Daftar Sekarang" />

         <p>Belum punya akun? Daftar <a href="#">disini</a></p>
        </section>
        <script src="script.js"></script>
    </body>
</html>
